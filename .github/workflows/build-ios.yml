name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web bundle
        run: node tools/build-web.mjs

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Pick newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || { grep -E "error:" xcodebuild.log | sort -u; exit 1; }
          grep -E "error:" xcodebuild.log | sort -u || true
          test -x build/Build/Products/Release-iphoneos/App.app/App

      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app out/Payload/
          cd out && zip -qry ../Cartridge.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Cartridge-ipa
          path: Cartridge.ipa
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 3
